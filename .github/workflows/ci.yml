name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

  build:
    name: Build Release (Linux)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Scaffold a minimal policy root (the desk arrives empty; someone has to put one paper on it)
        run: |
          mkdir -p .karen/policies/gates
          printf '%s\n' '{ "id": "ci-smoke", "event": "PreToolUse", "match": { "all": [ { "type": "always" } ] }, "action": { "type": "deny", "reason": "This gate exists so CI can prove the desk loads. She approves of proof of employment." } }' > .karen/policies/gates/ci-smoke.json
          cp examples/gates/*.json .karen/policies/gates/

      - name: Verify binary
        run: |
          ./target/release/karen --help
          ./target/release/karen validate
          ./target/release/karen check
          # A green validate proves nothing unless the scaffold was the layer it read.
          ./target/release/karen check --json --fields gates > gates.json
          grep -q '"id": *"ci-smoke"' gates.json
          grep -q '"id": *"no-force-push-to-main"' gates.json

      - name: Stage binary (unique name; she has seen two files named karen collide, and she will not relive it)
        run: cp target/release/karen karen-linux-x86_64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: karen-linux-x86_64
          path: karen-linux-x86_64
          retention-days: 7

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Scaffold a minimal policy root (the desk arrives empty; someone has to put one paper on it)
        run: |
          mkdir -p .karen/policies/gates
          printf '%s\n' '{ "id": "ci-smoke", "event": "PreToolUse", "match": { "all": [ { "type": "always" } ] }, "action": { "type": "deny", "reason": "This gate exists so CI can prove the desk loads. She approves of proof of employment." } }' > .karen/policies/gates/ci-smoke.json
          cp examples/gates/*.json .karen/policies/gates/

      - name: Verify binary
        run: |
          ./target/release/karen --help
          ./target/release/karen validate
          ./target/release/karen check
          # A green validate proves nothing unless the scaffold was the layer it read.
          ./target/release/karen check --json --fields gates > gates.json
          grep -q '"id": *"ci-smoke"' gates.json
          grep -q '"id": *"no-force-push-to-main"' gates.json

      - name: Stage binary (unique name; macos-latest is arm64, and she labels boxes honestly)
        run: cp target/release/karen karen-macos-aarch64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: karen-macos-aarch64
          path: karen-macos-aarch64
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Scaffold a minimal policy root (the desk arrives empty; someone has to put one paper on it)
        run: |
          New-Item -ItemType Directory -Force -Path .karen\policies\gates | Out-Null
          Set-Content -Path .karen\policies\gates\ci-smoke.json -Value '{ "id": "ci-smoke", "event": "PreToolUse", "match": { "all": [ { "type": "always" } ] }, "action": { "type": "deny", "reason": "This gate exists so CI can prove the desk loads. She approves of proof of employment." } }'
          Copy-Item examples\gates\*.json .karen\policies\gates\

      - name: Verify binary
        run: |
          .\target\release\karen.exe --help
          .\target\release\karen.exe validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\release\karen.exe check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A green validate proves nothing unless the scaffold was the layer it read.
          $gates = (.\target\release\karen.exe check --json --fields gates) -join "`n"
          if ($gates -notmatch '"id":\s*"ci-smoke"') { Write-Error "ci-smoke gate not loaded"; exit 1 }
          if ($gates -notmatch '"id":\s*"no-force-push-to-main"') { Write-Error "example gates not loaded"; exit 1 }

      - name: Stage binary (unique name; the collision was never her fault, but she fixed it anyway)
        run: copy target\release\karen.exe karen-windows-x86_64.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: karen-windows-x86_64.exe
          path: karen-windows-x86_64.exe
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: karen-linux-x86_64
          path: dist/

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: karen-macos-aarch64
          path: dist/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: karen-windows-x86_64.exe
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/karen-linux-x86_64
            dist/karen-macos-aarch64
            dist/karen-windows-x86_64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}